<?xml version="1.0" encoding="UTF-8"?>
<svg width="1150" height="480" viewBox="0 0 1150 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Inter',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1150" height="480" fill="#F8FAFC"/>

  <text x="575" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#12172B">Diagram Arsitektur — A09 Konfirmasi Janji Layanan</text>
  <text x="575" y="66" text-anchor="middle" font-size="12.5" fill="#64748B">Peran layanan · exchange · routing key · queue · penyimpanan · acknowledgment</text>

  <!-- 1. PRODUCER : 30-200 -->
  <rect x="30" y="150" width="170" height="130" rx="16" fill="white" stroke="#10B981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="115" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">① PERAN LAYANAN</text>
  <text x="115" y="215" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A">Producer</text>
  <text x="115" y="238" text-anchor="middle" font-size="10.5" fill="#64748B">Menerima pemesanan,</text>
  <text x="115" y="253" text-anchor="middle" font-size="10.5" fill="#64748B">mengirim pesan</text>

  <line x1="200" y1="215" x2="238" y2="215" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- 2. EXCHANGE : 240-410 -->
  <rect x="240" y="150" width="170" height="130" rx="16" fill="white" stroke="#7C3AED" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="325" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4C1D95">② EXCHANGE</text>
  <text x="325" y="215" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A">appointments</text>
  <text x="325" y="238" text-anchor="middle" font-size="10.5" fill="#64748B">Menerima pesan,</text>
  <text x="325" y="253" text-anchor="middle" font-size="10.5" fill="#64748B">meneruskan ke queue</text>

  <!-- gap 410-500: routing key -->
  <line x1="410" y1="215" x2="498" y2="215" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="418" y="176" width="74" height="42" rx="7" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="455" y="192" text-anchor="middle" font-size="9" font-weight="700" fill="#5B21B6">③ ROUTING</text>
  <text x="455" y="204" text-anchor="middle" font-size="9" font-weight="700" fill="#5B21B6">KEY</text>
  <text x="455" y="215" text-anchor="middle" font-size="7.5" fill="#7C3AED">appointment</text>

  <!-- 4. QUEUE : 500-670 -->
  <rect x="500" y="150" width="170" height="130" rx="16" fill="white" stroke="#7C3AED" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="585" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4C1D95">④ QUEUE</text>
  <text x="585" y="215" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A">confirmations</text>
  <text x="585" y="238" text-anchor="middle" font-size="10.5" fill="#64748B">Menampung pesan</text>
  <text x="585" y="253" text-anchor="middle" font-size="10.5" fill="#64748B">sampai diambil worker</text>

  <line x1="670" y1="215" x2="708" y2="215" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- 1b. WORKER : 710-880 -->
  <rect x="710" y="150" width="170" height="130" rx="16" fill="white" stroke="#10B981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="795" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">① PERAN LAYANAN</text>
  <text x="795" y="215" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A">Worker</text>
  <text x="795" y="238" text-anchor="middle" font-size="10.5" fill="#64748B">Mengambil pesan,</text>
  <text x="795" y="253" text-anchor="middle" font-size="10.5" fill="#64748B">memproses konfirmasi</text>

  <line x1="880" y1="215" x2="918" y2="215" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- 5. PENYIMPANAN : 920-1090 -->
  <rect x="920" y="150" width="170" height="130" rx="16" fill="white" stroke="#3B82F6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1005" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A8A">⑤ PENYIMPANAN</text>
  <text x="1005" y="215" text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A">Database</text>
  <text x="1005" y="238" text-anchor="middle" font-size="10.5" fill="#64748B">Hasil konfirmasi</text>
  <text x="1005" y="253" text-anchor="middle" font-size="10.5" fill="#64748B">tersimpan permanen</text>

  <!-- Ack: dari Worker melengkung ke Queue -->
  <path d="M795 280 C 795 350, 585 350, 585 282" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <rect x="620" y="332" width="220" height="44" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="730" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">⑥ ACKNOWLEDGMENT</text>
  <text x="730" y="366" text-anchor="middle" font-size="9.5" fill="#92400E">Worker memberi tahu broker: "pesan sudah selesai diproses"</text>

  <!-- Legend bawah -->
  <rect x="30" y="400" width="1090" height="60" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="50" y="424" font-size="11.5" font-weight="700" fill="#3730A3">Cara membaca diagram ini:</text>
  <text x="50" y="444" font-size="10.5" fill="#3730A3">Producer mengirim pesan → melewati Exchange dengan label tertentu (routing key) → ditampung di Queue → diambil Worker → disimpan ke Database → Worker mengonfirmasi selesai (ack) ke Queue.</text>
</svg>
