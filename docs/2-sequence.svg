<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="700" viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Inter',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1100" height="700" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1100" height="60" fill="#1E293B"/>
  <rect x="24" y="14" width="32" height="32" rx="8" fill="#6366F1"/>
  <text x="40" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="white">A09</text>
  <text x="68" y="28" font-size="16" font-weight="700" fill="white">Sequence Diagram — Alur Satu Pesan</text>
  <text x="68" y="46" font-size="11" fill="#94A3B8">Urutan waktu dari publish hingga acknowledgment</text>

  <!-- Lifelines -->
  <!-- Producer, Exchange, Queue, Worker, PostgreSQL -->
  <!-- x positions -->
  <!-- 130, 340, 550, 760, 970 -->

  <!-- Actor headers -->
  <rect x="60" y="84" width="140" height="46" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="130" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">Producer</text>

  <rect x="270" y="84" width="140" height="46" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="340" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">Exchange</text>

  <rect x="480" y="84" width="140" height="46" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="550" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">Queue</text>

  <rect x="690" y="84" width="140" height="46" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="760" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">Worker</text>

  <rect x="900" y="84" width="140" height="46" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="970" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">PostgreSQL</text>

  <!-- Lifelines vertical -->
  <line x1="130" y1="130" x2="130" y2="660" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="340" y1="130" x2="340" y2="660" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="550" y1="130" x2="550" y2="660" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="760" y1="130" x2="760" y2="660" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="970" y1="130" x2="970" y2="660" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Step 1: Producer -> Exchange -->
  <line x1="130" y1="164" x2="332" y2="164" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="234" y="156" text-anchor="middle" font-size="10.5" fill="#334155">1. publish(event, persistent=true)</text>

  <!-- Step 2: Exchange -> Queue (routing) -->
  <line x1="340" y1="196" x2="542" y2="196" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="440" y="188" text-anchor="middle" font-size="10.5" fill="#5B21B6">2. route via appointment.booked</text>

  <!-- Step 3: Exchange -> Producer (confirm) -->
  <line x1="332" y1="228" x2="138" y2="228" stroke="#10B981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="234" y="220" text-anchor="middle" font-size="10.5" fill="#065F46">3. basic.ack (publisher confirm)</text>

  <!-- Note: confirm caveat -->
  <rect x="60" y="244" width="410" height="34" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
  <text x="265" y="258" text-anchor="middle" font-size="9.5" fill="#78350F" font-weight="600">Catatan: confirm hanya membuktikan broker menerima —</text>
  <text x="265" y="271" text-anchor="middle" font-size="9.5" fill="#78350F">bukan bahwa pesan sudah masuk queue tujuan</text>

  <!-- Step 4: Queue -> Worker (delivery) -->
  <line x1="550" y1="300" x2="752" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="651" y="292" text-anchor="middle" font-size="10.5" fill="#334155">4. deliver (prefetch=1)</text>

  <!-- Worker processing box -->
  <rect x="720" y="316" width="80" height="220" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
  <text x="760" y="332" text-anchor="middle" font-size="9" font-weight="700" fill="#065F46" transform="rotate(0)">worker aktif</text>

  <!-- Step 5: Worker validasi -->
  <rect x="660" y="344" width="200" height="30" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="760" y="363" text-anchor="middle" font-size="10" fill="#78350F">5. validasi appointment_id</text>

  <!-- Step 6: Worker -> PostgreSQL insert -->
  <line x1="760" y1="392" x2="962" y2="392" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="861" y="384" text-anchor="middle" font-size="10" fill="#334155">6. INSERT ... ON CONFLICT DO NOTHING</text>

  <!-- Step 7: PostgreSQL -> Worker (rowCount) -->
  <line x1="962" y1="424" x2="768" y2="424" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="861" y="416" text-anchor="middle" font-size="10" fill="#1E3A8A">7. commit → rowCount (1=baru, 0=duplikat)</text>

  <!-- Step 8: Worker -> Queue (ack) -->
  <rect x="655" y="440" width="240" height="30" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="775" y="459" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">8. ack() — HANYA setelah commit</text>

  <line x1="752" y1="486" x2="558" y2="486" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="655" y="478" text-anchor="middle" font-size="10.5" fill="#065F46">9. basic.ack → broker buang pesan</text>

  <!-- Critical zone box -->
  <rect x="695" y="500" width="330" height="80" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="860" y="520" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">ZONA KRITIS</text>
  <text x="860" y="538" text-anchor="middle" font-size="9.5" fill="#B91C1C">Jika worker crash SEBELUM langkah 9,</text>
  <text x="860" y="552" text-anchor="middle" font-size="9.5" fill="#B91C1C">broker akan redeliver pesan yang sama.</text>
  <text x="860" y="566" text-anchor="middle" font-size="9.5" fill="#B91C1C">ON CONFLICT (langkah 6) mencegah duplikasi.</text>

  <!-- Bottom legend -->
  <rect x="60" y="600" width="980" height="60" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="620" font-size="10.5" font-weight="700" fill="#334155">Prinsip kunci: acknowledgment (langkah 8-9) dikirim SETELAH database commit (langkah 7),</text>
  <text x="80" y="638" font-size="10.5" fill="#334155">bukan sebelumnya — ini yang menjamin tidak ada efek bisnis hilang meski worker crash di tengah proses.</text>
</svg>
