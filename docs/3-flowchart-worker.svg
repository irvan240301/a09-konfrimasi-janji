<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Inter',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="900" height="900" fill="#F8FAFC"/>
  <rect x="0" y="0" width="900" height="60" fill="#1E293B"/>
  <rect x="24" y="14" width="32" height="32" rx="8" fill="#6366F1"/>
  <text x="40" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="white">A09</text>
  <text x="68" y="28" font-size="16" font-weight="700" fill="white">Flowchart Alur Keputusan Worker</text>
  <text x="68" y="46" font-size="11" fill="#94A3B8">Dari terima pesan hingga acknowledgment</text>

  <!-- Start -->
  <rect x="370" y="86" width="160" height="46" rx="23" fill="#1E293B"/>
  <text x="450" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="white">Pesan diterima worker</text>

  <line x1="450" y1="132" x2="450" y2="164" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision 1: JSON valid? -->
  <polygon points="450,166 540,206 450,246 360,206" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="200" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350F">JSON valid?</text>
  <text x="450" y="216" text-anchor="middle" font-size="9" fill="#92400E">(bisa di-parse)</text>

  <!-- No -> rejected INVALID_JSON -->
  <line x1="360" y1="206" x2="200" y2="206" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="150" y="188" width="60" height="24" rx="6" fill="#FEF2F2"/>
  <text x="180" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">Tidak</text>

  <rect x="30" y="230" width="220" height="64" rx="10" fill="white" stroke="#FCA5A5" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="250" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991B1B">INSERT rejected</text>
  <text x="140" y="266" text-anchor="middle" font-size="9.5" fill="#B91C1C">reason: INVALID_JSON</text>
  <text x="140" y="281" text-anchor="middle" font-size="9.5" fill="#B91C1C">→ ack() (tanpa requeue)</text>

  <!-- Yes -> continue down -->
  <line x1="450" y1="246" x2="450" y2="288" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="464" y="256" width="30" height="22" rx="5" fill="#D1FAE5"/>
  <text x="479" y="271" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">Ya</text>

  <!-- Decision 2: appointment_id ada? -->
  <polygon points="450,290 560,336 450,382 340,336" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350F">appointment_id</text>
  <text x="450" y="346" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350F">ada?</text>

  <!-- No -> rejected MISSING -->
  <line x1="340" y1="336" x2="220" y2="336" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="255" y="318" width="60" height="24" rx="6" fill="#FEF2F2"/>
  <text x="285" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">Tidak (X01)</text>

  <rect x="30" y="360" width="220" height="64" rx="10" fill="white" stroke="#FCA5A5" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="380" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991B1B">INSERT rejected</text>
  <text x="140" y="396" text-anchor="middle" font-size="9.5" fill="#B91C1C">reason: MISSING_appointment_id</text>
  <text x="140" y="411" text-anchor="middle" font-size="9.5" fill="#B91C1C">→ ack() (tanpa requeue)</text>

  <!-- Yes -> continue -->
  <line x1="450" y1="382" x2="450" y2="424" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="464" y="392" width="30" height="22" rx="5" fill="#D1FAE5"/>
  <text x="479" y="407" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">Ya</text>

  <!-- Process: INSERT ON CONFLICT -->
  <rect x="330" y="426" width="240" height="78" rx="12" fill="white" stroke="#A78BFA" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="448" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4C1D95">INSERT INTO receipts</text>
  <text x="450" y="464" text-anchor="middle" font-size="9.5" fill="#5B21B6">ON CONFLICT (event_id)</text>
  <text x="450" y="479" text-anchor="middle" font-size="9.5" fill="#5B21B6">DO NOTHING</text>
  <text x="450" y="495" text-anchor="middle" font-size="9" fill="#7C3AED" font-style="italic">(operasi atomik)</text>

  <line x1="450" y1="504" x2="450" y2="536" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision 3: query berhasil? -->
  <polygon points="450,538 560,584 450,630 340,584" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="578" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350F">Query DB</text>
  <text x="450" y="594" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350F">berhasil?</text>

  <!-- No -> error lingkungan -->
  <line x1="560" y1="584" x2="700" y2="584" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="600" y="566" width="60" height="24" rx="6" fill="#FEF9E7"/>
  <text x="630" y="582" text-anchor="middle" font-size="9.5" font-weight="700" fill="#D97706">Tidak</text>

  <rect x="650" y="608" width="220" height="78" rx="10" fill="white" stroke="#FCD34D" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="628" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">Error Lingkungan</text>
  <text x="760" y="644" text-anchor="middle" font-size="9.5" fill="#B45309">(DB mati / koneksi putus)</text>
  <text x="760" y="660" text-anchor="middle" font-size="9.5" fill="#B45309">nack(msg, false, true)</text>
  <text x="760" y="675" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400E">→ requeue ke broker</text>

  <!-- Yes -> continue -->
  <line x1="450" y1="630" x2="450" y2="672" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="464" y="640" width="30" height="22" rx="5" fill="#D1FAE5"/>
  <text x="479" y="655" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">Ya</text>

  <!-- Decision 4: rowCount -->
  <rect x="330" y="674" width="240" height="70" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="696" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065F46">Cek rowCount</text>
  <text x="450" y="713" text-anchor="middle" font-size="9.5" fill="#047857">1 = receipt baru tersimpan</text>
  <text x="450" y="728" text-anchor="middle" font-size="9.5" fill="#047857">0 = duplikat, diabaikan (U3)</text>

  <line x1="450" y1="744" x2="450" y2="776" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Final: ack -->
  <rect x="330" y="778" width="240" height="60" rx="30" fill="#10B981" filter="url(#shadow)"/>
  <text x="450" y="802" text-anchor="middle" font-size="13" font-weight="800" fill="white">ack() ke broker</text>
  <text x="450" y="820" text-anchor="middle" font-size="9.5" fill="#D1FAE5">pesan dibuang dari queue</text>

  <!-- Note box -->
  <rect x="600" y="778" width="270" height="60" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="735" y="796" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3730A3">Ketiga jalur ack (INVALID_JSON,</text>
  <text x="735" y="810" text-anchor="middle" font-size="9.5" fill="#3730A3">MISSING_appointment_id, receipt sukses)</text>
  <text x="735" y="824" text-anchor="middle" font-size="9.5" fill="#3730A3">selalu terjadi SETELAH tulis ke DB.</text>
</svg>
