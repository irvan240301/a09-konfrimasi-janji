<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Inter',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1000" height="560" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1000" height="60" fill="#1E293B"/>
  <rect x="24" y="14" width="32" height="32" rx="8" fill="#6366F1"/>
  <text x="40" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="white">A09</text>
  <text x="68" y="28" font-size="16" font-weight="700" fill="white">Diagram Skema Database</text>
  <text x="68" y="46" font-size="11" fill="#94A3B8">PostgreSQL — a09db</text>

  <!-- tabel receipts -->
  <rect x="80" y="100" width="380" height="360" rx="14" fill="white" stroke="#6EE7B7" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="80" y="100" width="380" height="48" rx="14" fill="#10B981"/>
  <rect x="80" y="128" width="380" height="20" fill="#10B981"/>
  <text x="270" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="white">receipts</text>

  <!-- kolom-kolom receipts -->
  <!-- header row -->
  <rect x="80" y="148" width="200" height="28" fill="#F0FDF4"/>
  <rect x="280" y="148" width="180" height="28" fill="#F0FDF4"/>
  <text x="96" y="167" font-size="10" font-weight="700" fill="#065F46">KOLOM</text>
  <text x="296" y="167" font-size="10" font-weight="700" fill="#065F46">TIPE / KETERANGAN</text>

  <!-- rows -->
  <!-- event_id -->
  <line x1="80" y1="176" x2="460" y2="176" stroke="#D1FAE5" stroke-width="1"/>
  <text x="96" y="196" font-size="11" font-weight="700" fill="#0F172A">🔑 event_id</text>
  <text x="296" y="196" font-size="10" fill="#374151">TEXT PRIMARY KEY</text>

  <line x1="80" y1="206" x2="460" y2="206" stroke="#D1FAE5" stroke-width="1"/>
  <text x="96" y="226" font-size="11" fill="#0F172A">appointment_id</text>
  <text x="296" y="226" font-size="10" fill="#374151">TEXT NOT NULL</text>

  <line x1="80" y1="236" x2="460" y2="236" stroke="#D1FAE5" stroke-width="1"/>
  <text x="96" y="256" font-size="11" fill="#0F172A">customer_id</text>
  <text x="296" y="256" font-size="10" fill="#374151">TEXT (boleh null)</text>

  <line x1="80" y1="266" x2="460" y2="266" stroke="#D1FAE5" stroke-width="1"/>
  <text x="96" y="286" font-size="11" fill="#0F172A">slot</text>
  <text x="296" y="286" font-size="10" fill="#374151">TEXT NOT NULL</text>

  <line x1="80" y1="296" x2="460" y2="296" stroke="#D1FAE5" stroke-width="1"/>
  <text x="96" y="316" font-size="11" fill="#0F172A">status</text>
  <text x="296" y="316" font-size="10" fill="#374151">DEFAULT 'CONFIRMED...'</text>

  <line x1="80" y1="326" x2="460" y2="326" stroke="#D1FAE5" stroke-width="1"/>
  <text x="96" y="346" font-size="11" fill="#0F172A">run_id</text>
  <text x="296" y="346" font-size="10" fill="#374151">TEXT NOT NULL</text>

  <line x1="80" y1="356" x2="460" y2="356" stroke="#D1FAE5" stroke-width="1"/>
  <text x="96" y="376" font-size="11" fill="#0F172A">occurred_at</text>
  <text x="296" y="376" font-size="10" fill="#374151">TIMESTAMPTZ</text>

  <line x1="80" y1="386" x2="460" y2="386" stroke="#D1FAE5" stroke-width="1"/>
  <text x="96" y="406" font-size="11" fill="#0F172A">processed_at</text>
  <text x="296" y="406" font-size="10" fill="#374151">TIMESTAMPTZ DEFAULT now()</text>

  <line x1="80" y1="416" x2="460" y2="416" stroke="#D1FAE5" stroke-width="1"/>

  <!-- Idempotency note for receipts -->
  <rect x="96" y="424" width="348" height="26" rx="6" fill="#D1FAE5"/>
  <text x="270" y="441" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065F46">Idempotency: PK event_id + ON CONFLICT DO NOTHING</text>

  <!-- vertical col divider -->
  <line x1="280" y1="148" x2="280" y2="416" stroke="#D1FAE5" stroke-width="1"/>

  <!-- tabel rejected -->
  <rect x="540" y="100" width="380" height="300" rx="14" fill="white" stroke="#FCA5A5" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="540" y="100" width="380" height="48" rx="14" fill="#EF4444"/>
  <rect x="540" y="128" width="380" height="20" fill="#EF4444"/>
  <text x="730" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="white">rejected</text>

  <rect x="540" y="148" width="200" height="28" fill="#FEF2F2"/>
  <rect x="740" y="148" width="180" height="28" fill="#FEF2F2"/>
  <text x="556" y="167" font-size="10" font-weight="700" fill="#991B1B">KOLOM</text>
  <text x="756" y="167" font-size="10" font-weight="700" fill="#991B1B">TIPE / KETERANGAN</text>

  <line x1="540" y1="176" x2="920" y2="176" stroke="#FEE2E2" stroke-width="1"/>
  <text x="556" y="196" font-size="11" font-weight="700" fill="#0F172A">🔑 id</text>
  <text x="756" y="196" font-size="10" fill="#374151">BIGSERIAL PRIMARY KEY</text>

  <line x1="540" y1="206" x2="920" y2="206" stroke="#FEE2E2" stroke-width="1"/>
  <text x="556" y="226" font-size="11" fill="#0F172A">event_id</text>
  <text x="756" y="226" font-size="10" fill="#374151">TEXT (boleh null)</text>

  <line x1="540" y1="236" x2="920" y2="236" stroke="#FEE2E2" stroke-width="1"/>
  <text x="556" y="256" font-size="11" fill="#0F172A">payload</text>
  <text x="756" y="256" font-size="10" fill="#374151">JSONB</text>

  <line x1="540" y1="266" x2="920" y2="266" stroke="#FEE2E2" stroke-width="1"/>
  <text x="556" y="286" font-size="11" fill="#0F172A">reason</text>
  <text x="756" y="286" font-size="10" fill="#374151">TEXT NOT NULL</text>

  <line x1="540" y1="296" x2="920" y2="296" stroke="#FEE2E2" stroke-width="1"/>
  <text x="556" y="316" font-size="11" fill="#0F172A">run_id</text>
  <text x="756" y="316" font-size="10" fill="#374151">TEXT</text>

  <line x1="540" y1="326" x2="920" y2="326" stroke="#FEE2E2" stroke-width="1"/>
  <text x="556" y="346" font-size="11" fill="#0F172A">rejected_at</text>
  <text x="756" y="346" font-size="10" fill="#374151">TIMESTAMPTZ DEFAULT now()</text>

  <line x1="540" y1="356" x2="920" y2="356" stroke="#FEE2E2" stroke-width="1"/>

  <rect x="556" y="364" width="348" height="26" rx="6" fill="#FEE2E2"/>
  <text x="730" y="381" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">Jalur terminal: reason cth. MISSING_appointment_id</text>

  <line x1="740" y1="148" x2="740" y2="356" stroke="#FEE2E2" stroke-width="1"/>

  <!-- Relasi keterangan bawah -->
  <rect x="80" y="480" width="840" height="60" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="502" font-size="10.5" font-weight="700" fill="#334155">Kedua tabel tidak memiliki foreign key satu sama lain — event yang sama hanya masuk SALAH SATU tabel,</text>
  <text x="100" y="520" font-size="10.5" fill="#334155">tergantung hasil validasi appointment_id. Ini menjaga pemisahan yang jelas antara efek bisnis dan pesan bermasalah.</text>
</svg>
