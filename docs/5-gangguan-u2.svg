<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="620" viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Inter',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1100" height="620" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1100" height="60" fill="#1E293B"/>
  <rect x="24" y="14" width="32" height="32" rx="8" fill="#6366F1"/>
  <text x="40" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="white">A09</text>
  <text x="68" y="28" font-size="16" font-weight="700" fill="white">Diagram Uji Gangguan Consumer (U2)</text>
  <text x="68" y="46" font-size="11" fill="#94A3B8">Timeline: worker mati → pesan tertahan → worker pulih → diproses otomatis</text>

  <!-- Timeline horizontal -->
  <line x1="60" y1="140" x2="1040" y2="140" stroke="#CBD5E1" stroke-width="3"/>

  <!-- T0 -->
  <circle cx="100" cy="140" r="8" fill="#10B981"/>
  <text x="100" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">T0</text>
  <text x="100" y="164" text-anchor="middle" font-size="9.5" fill="#475569">Kondisi normal</text>
  <text x="100" y="178" text-anchor="middle" font-size="9.5" fill="#475569">20 receipt (U1)</text>

  <!-- T1 -->
  <circle cx="330" cy="140" r="8" fill="#DC2626"/>
  <text x="330" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">T1</text>
  <text x="330" y="164" text-anchor="middle" font-size="9.5" fill="#475569">Worker dimatikan</text>
  <text x="330" y="178" text-anchor="middle" font-size="9.5" fill="#475569">(CTRL+C)</text>

  <!-- T2 -->
  <circle cx="560" cy="140" r="8" fill="#D97706"/>
  <text x="560" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">T2</text>
  <text x="560" y="164" text-anchor="middle" font-size="9.5" fill="#475569">G01–G05 dipublish</text>
  <text x="560" y="178" text-anchor="middle" font-size="9.5" fill="#475569">Ready=5, Consumers=0</text>

  <!-- T3 -->
  <circle cx="790" cy="140" r="8" fill="#3B82F6"/>
  <text x="790" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">T3</text>
  <text x="790" y="164" text-anchor="middle" font-size="9.5" fill="#475569">Worker dihidupkan</text>
  <text x="790" y="178" text-anchor="middle" font-size="9.5" fill="#475569">kembali</text>

  <!-- T4 -->
  <circle cx="1010" cy="140" r="8" fill="#10B981"/>
  <text x="1010" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">T4</text>
  <text x="1010" y="164" text-anchor="middle" font-size="9.5" fill="#475569">Pulih otomatis</text>
  <text x="1010" y="178" text-anchor="middle" font-size="9.5" fill="#475569">25 receipt</text>

  <!-- Panel bawah: 4 kondisi -->
  <!-- Panel 1: Normal -->
  <rect x="60" y="210" width="240" height="180" rx="14" fill="white" stroke="#6EE7B7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="210" width="240" height="34" rx="14" fill="#10B981"/>
  <rect x="60" y="230" width="240" height="14" fill="#10B981"/>
  <text x="180" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="white">Kondisi Normal</text>
  <text x="180" y="268" text-anchor="middle" font-size="10.5" fill="#374151">Worker: ● aktif</text>
  <text x="180" y="288" text-anchor="middle" font-size="10.5" fill="#374151">Queue Ready: 0</text>
  <text x="180" y="308" text-anchor="middle" font-size="10.5" fill="#374151">Consumers: 1</text>
  <text x="180" y="328" text-anchor="middle" font-size="10.5" fill="#374151">Receipts: 20</text>
  <rect x="76" y="342" width="208" height="30" rx="6" fill="#F0FDF4"/>
  <text x="180" y="361" text-anchor="middle" font-size="9" fill="#065F46">Pesan diproses segera saat masuk</text>

  <!-- Panel 2: Gangguan -->
  <rect x="330" y="210" width="240" height="180" rx="14" fill="white" stroke="#FCA5A5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="330" y="210" width="240" height="34" rx="14" fill="#EF4444"/>
  <rect x="330" y="230" width="240" height="14" fill="#EF4444"/>
  <text x="450" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="white">Saat Gangguan</text>
  <text x="450" y="268" text-anchor="middle" font-size="10.5" fill="#374151">Worker: ○ mati</text>
  <text x="450" y="288" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC2626">Queue Ready: 5</text>
  <text x="450" y="308" text-anchor="middle" font-size="10.5" fill="#374151">Consumers: 0</text>
  <text x="450" y="328" text-anchor="middle" font-size="10.5" fill="#374151">Receipts: 20 (tetap)</text>
  <rect x="346" y="342" width="208" height="30" rx="6" fill="#FEF2F2"/>
  <text x="450" y="361" text-anchor="middle" font-size="9" fill="#991B1B">Pesan aman tertahan di queue durable</text>

  <!-- Panel 3: Pemulihan -->
  <rect x="600" y="210" width="240" height="180" rx="14" fill="white" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)"/>
  <rect x="600" y="210" width="240" height="34" rx="14" fill="#3B82F6"/>
  <rect x="600" y="230" width="240" height="14" fill="#3B82F6"/>
  <text x="720" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="white">Proses Pemulihan</text>
  <text x="720" y="268" text-anchor="middle" font-size="10.5" fill="#374151">Worker: ● aktif kembali</text>
  <text x="720" y="288" text-anchor="middle" font-size="10.5" fill="#374151">Queue Ready: 5 → 0</text>
  <text x="720" y="308" text-anchor="middle" font-size="10.5" fill="#374151">Consumers: 1</text>
  <text x="720" y="328" text-anchor="middle" font-size="10.5" fill="#374151">Receipts: bertambah</text>
  <rect x="616" y="342" width="208" height="30" rx="6" fill="#EFF6FF"/>
  <text x="720" y="361" text-anchor="middle" font-size="9" fill="#1E3A8A">Diproses otomatis, tanpa kirim ulang manual</text>

  <!-- Panel 4: Selesai -->
  <rect x="870" y="210" width="200" height="180" rx="14" fill="white" stroke="#6EE7B7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="870" y="210" width="200" height="34" rx="14" fill="#10B981"/>
  <rect x="870" y="230" width="200" height="14" fill="#10B981"/>
  <text x="970" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="white">Selesai</text>
  <text x="970" y="268" text-anchor="middle" font-size="10.5" fill="#374151">Worker: ● aktif</text>
  <text x="970" y="288" text-anchor="middle" font-size="10.5" fill="#374151">Queue Ready: 0</text>
  <text x="970" y="308" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065F46">Receipts: 25</text>
  <rect x="886" y="342" width="168" height="30" rx="6" fill="#F0FDF4"/>
  <text x="970" y="356" text-anchor="middle" font-size="9" fill="#065F46">0 pesan hilang</text>
  <text x="970" y="368" text-anchor="middle" font-size="9" fill="#065F46">selama gangguan</text>

  <!-- Kesimpulan box -->
  <rect x="60" y="410" width="1010" height="90" rx="12" fill="#1E293B"/>
  <text x="565" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="white">Yang Dibuktikan U2</text>
  <text x="565" y="462" text-anchor="middle" font-size="10.5" fill="#CBD5E1">Durable queue + persistent message memastikan pesan tidak hilang meski consumer mati.</text>
  <text x="565" y="480" text-anchor="middle" font-size="10.5" fill="#CBD5E1">RabbitMQ secara otomatis mengirim pesan tertahan begitu consumer aktif kembali — tanpa campur tangan manual.</text>

  <!-- Batas box -->
  <rect x="60" y="516" width="1010" height="70" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="80" y="538" font-size="10.5" font-weight="700" fill="#92400E">Batas pengujian:</text>
  <text x="80" y="556" font-size="10" fill="#78350F">Uji ini membuktikan ketahanan terhadap gangguan CONSUMER, bukan gangguan broker atau database.</text>
  <text x="80" y="572" font-size="10" fill="#78350F">Kegagalan RabbitMQ atau PostgreSQL itu sendiri berada di luar cakupan pengujian U2.</text>
</svg>
